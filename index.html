<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel & Revelation: Zoom & Classroom Study Hub</title>
    <style>
        :root {
            --bg-dark: #111827;
            --panel-bg: #1f2937;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --text-light: #f3f4f6;
            --text-dark: #1f2937;
            --gold: #d97706;
            --border: #374151;
        }
        body {
            font-family: Georgia, serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* --- GLOBAL NAVIGATION --- */
        .global-nav {
            background: #0f172a;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            font-family: -apple-system, sans-serif;
            flex-wrap: wrap;
            gap: 15px;
        }
        .global-nav h1 { margin: 0; font-size: 1.3em; color: #60a5fa; }
        .controls { display: flex; gap: 10px; align-items: center; }
        select {
            background: #334155;
            color: white;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 1em;
            cursor: pointer;
        }
        .mode-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .mode-btn.active { background: var(--accent); }
        .mode-btn:hover { background: var(--accent-hover); }

        /* --- VIEWS --- */
        .view-container { display: none; flex: 1; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .view-container.active { display: block; }

        /* --- STUDENT NOTES --- */
        .student-notes {
            margin-top: 30px;
            border-top: 2px dashed #cbd5e1;
            padding-top: 20px;
            font-family: -apple-system, sans-serif;
        }
        .student-notes textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 1px solid #94a3b8;
            border-radius: 8px;
            font-size: 1em;
            box-sizing: border-box;
            resize: vertical;
            background: #f8fafc;
        }

        /* --- TEACHER VIEW --- */
        .teacher-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        @media (max-width: 900px) { .teacher-layout { grid-template-columns: 1fr; } }
        
        .script-panel, .preview-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 25px;
            height: calc(100vh - 130px);
            overflow-y: auto;
        }
        .script-panel h2 { color: var(--gold); margin-top: 0; font-family: -apple-system, sans-serif; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
        
        .script-text { font-size: 1.15em; line-height: 1.8; color: #e5e7eb; white-space: pre-line; }
        .script-text strong { color: #93c5fd; }
        .script-text h3 { color: #60a5fa; margin-top: 25px; margin-bottom: 10px; border-bottom: 1px solid #374151; padding-bottom: 5px; }
        
        /* --- ZOOM PRESENTATION & STUDENT SHARED STYLES --- */
        .presentation-card {
            background: white;
            color: var(--text-dark);
            max-width: 900px;
            margin: 0 auto;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            font-size: 1.1em;
            line-height: 1.7;
        }
        .presentation-card h1 { color: #1e3a8a; border-bottom: 3px solid var(--gold); padding-bottom: 10px; margin-top: 0; }
        .point-block { background: #f8fafc; border-left: 4px solid var(--accent); padding: 15px; margin-bottom: 15px; border-radius: 0 6px 6px 0; }
        .open-block { background: #fffbeb; border-left: 4px solid var(--gold); padding: 15px; margin-bottom: 15px; border-radius: 0 6px 6px 0; }
        
    </style>
</head>
<body>

    <!-- TOP NAVIGATION -->
    <div class="global-nav">
        <h1>📖 Study Hub: Daniel & Revelation</h1>
        <div class="controls">
            <select id="session-select" onchange="loadSession(this.value)"></select>
            <button class="mode-btn active" id="btn-student" onclick="switchMode('student')">📝 Student Follow-Along</button>
            <button class="mode-btn" id="btn-teacher" onclick="switchMode('teacher')">🔒 Teacher Script</button>
            <button class="mode-btn" id="btn-zoom" onclick="switchMode('zoom')">🔒 Zoom Presentation Screen</button>
        </div>
    </div>

    <!-- 1. STUDENT VIEW -->
    <div id="view-student" class="view-container active">
        <div class="presentation-card">
            <div id="student-content"></div>
            <div class="student-notes">
                <h3 style="margin-top: 0; color: #334155;">My Personal Notes:</h3>
                <textarea placeholder="Type your thoughts, questions, and insights here as the session happens..."></textarea>
            </div>
        </div>
    </div>

    <!-- 2. TEACHER VIEW (Script + Preview) -->
    <div id="view-teacher" class="view-container">
        <div class="teacher-layout">
            <div class="script-panel">
                <h2>🗣️ Your Full Reading Script</h2>
                <div class="script-text" id="teacher-script-content"></div>
            </div>
            <div class="preview-panel">
                <h2 style="color: #60a5fa;">👁️ Screen Preview (What they see)</h2>
                <div class="presentation-card" id="teacher-preview-content" style="padding: 20px; font-size: 0.9em;"></div>
            </div>
        </div>
    </div>

    <!-- 3. ZOOM PRESENTATION VIEW (Clean Screen Share) -->
    <div id="view-zoom" class="view-container">
        <div class="presentation-card" id="zoom-content"></div>
    </div>

<script>
    // Full Study Database with robust introductory scripts
    const SESSIONS = [
        {
            label: "Daniel Chapter 1 — The Siege on Identity and Daniel's Resolve",
            teacherScript: `Good morning, everyone. Today we are opening the book of Daniel, and we are starting right in the fires of cultural exile. 

To understand what is happening in Chapter 1, we have to look at the historical context. The year is 605 BC. King Nebuchadnezzar of Babylon has just besieged Jerusalem. But Nebuchadnezzar is a master tactician; he doesn't just want to destroy the city. He wants to absorb it. His strategy is to take the best, the brightest, and the most promising young men from the royal families and bring them to Babylon. 

### The Assault on Identity
Look at verses 3 through 5. Nebuchadnezzar isn't just throwing them in a dungeon; he puts them in a three-year Babylonian university program. He wants to teach them the language, the literature, and the worldview of the Chaldeans. He wants them to think like Babylonians.

The ultimate psychological warfare happens in verse 7: the renaming. In the ancient world, your name was your identity and your theology. 
• **Daniel** means "God is my judge." They change his name to **Belteshazzar**, meaning "Bel protect his life" (Bel being a chief Babylonian god).
• **Hananiah** means "Yahweh is gracious." They change it to **Shadrach**, meaning "Command of Aku" (the moon god).
• **Mishael** means "Who is what God is?" They change it to **Meshach**, meaning "Who is what Aku is?"
• **Azariah** means "Yahweh has helped." They change it to **Abednego**, meaning "Servant of Nego or Nebo."

They systematically stripped the name of the true God, Yahweh, out of their identities and replaced it with pagan idols. 

### Drawing the Line
But notice what happens next. Daniel and his friends accept the Babylonian education. They accept the new names. But in verse 8, Daniel draws a hard, non-negotiable line: *he resolves not to defile himself with the king's food and wine.* 

Why the food? Why draw the line there? This wasn't just about Jewish dietary laws or being a vegetarian. In the ancient world, the meat and wine from the king's table were first offered as sacrifices to the Babylonian gods. To eat that food was to sit in fellowship with those idols. Daniel essentially says, "You can change my address, you can change my curriculum, and you can even change my legal name, but you cannot have my worship." 

### The Result of Faithfulness
Daniel responds with polite, respectful, but absolute resistance. He proposes a 10-day test of vegetables and water. And God honors that faithfulness. Verses 12 through 17 show us that God grants them not just physical health, but supernatural wisdom—finding them ten times better than all the magicians and enchanters in the realm.

As we look at our own lives today, we have to ask ourselves: Where is the culture trying to quietly rename us? And where are we drawing our absolute line of faith? Let's look at the key points and open up the floor to our discussion questions.`,
            
            points: [
                "**The Strategy of Assimilation (1:3-5):** Babylon didn't just want physical captives; they wanted the minds of the next generation. They immersed the Hebrew youths in Chaldean literature and culture to erase their heritage.",
                "**The Assault on Identity (1:7):** The renaming was psychological warfare. They systematically replaced the name of Yahweh in the youths' names with the names of Babylonian gods (Bel, Aku, Nebo).",
                "**Drawing the Line (1:8):** Daniel accepted the education and the new name, but refused the king's food. The 'king's meat' was sacrificed to Babylonian idols; eating it was a covenant violation and an act of pagan worship.",
                "**The 10-Day Test and Divine Favor (1:12-17):** God honors their faithful resistance by granting them not just physical health, but supernatural wisdom—ten times better than Babylon's best."
            ],
            refs: [
                "Leviticus 11 — The dietary laws that formed the baseline of Daniel's concern.",
                "1 Corinthians 10:20-21 — The New Testament parallel on why eating food offered to idols compromises our fellowship with God.",
                "Romans 12:2 — 'Do not be conformed to this world, but be transformed...'"
            ],
            opens: [
                "Daniel and his friends accepted Babylonian education and pagan names, but drew a hard line at the food. In our culture today, how do we discern the difference between 'harmless cultural participation' and 'spiritual compromise'?",
                "Was Daniel's 10-day test (1:12-14) meant as a repeatable principle for us to claim today, or a one-time sign for that specific situation?"
            ]
        },
        {
            label: "Daniel Chapter 2 — The Dream of Empires",
            teacherScript: `Welcome back, everyone. Today we are looking at Daniel Chapter 2, and we start with a sleepless king. 

Imagine being Nebuchadnezzar. You are the most powerful dictator on the planet. You have conquered the known world. But you wake up terrified, in a cold sweat, from a dream that you can't even remember. 

### The Crisis of Worldly Wisdom
Nebuchadnezzar is desperate, and he does something unprecedented. He calls in all his elite astrologers and magicians and makes an impossible demand: "Don't just interpret the dream. Tell me *what* I dreamed, or I will literally cut you into pieces." 

The Chaldeans admit the truth in verse 11: "No one can do this except the gods, and they don't live among humans." Worldly wisdom completely bankrupts itself right here. The best the empire has to offer has absolutely no answers.

### Daniel's Faithful Response
When the death squad comes to execute the wise men, including Daniel, notice Daniel's reaction. He doesn't panic. Verse 14 says he responds with "counsel and prudence." He asks the king for time, and then he does the most important thing a leader can do: he gathers his three friends for a prayer meeting to plead for mercy from the God of heaven. He doesn't rely on his own intellect; he relies on revelation.

### The Blueprint of Human Empires
God reveals the dream to Daniel in the night. Nebuchadnezzar saw a massive, terrifying statue. 
• A head of **gold** (representing Babylon).
• Chest and arms of **silver** (Medo-Persia).
• Belly and thighs of **bronze** (Greece).
• Legs of **iron** with feet of iron mixed with clay (Rome and its fragmented remnants). 
    
This statue serves as the master blueprint for biblical prophecy. The rest of Daniel, and later the Book of Revelation, will build heavily on this exact sequence of empires. 

### The Stone Cut Without Hands
But the climax of the dream isn't the metals. It's the stone. Look at verse 34: A stone "cut out without hands" strikes the statue on its fragile feet, shattering the entire history of human empires into dust. That stone then grows into a mountain that fills the whole earth. 
    
That stone is the Kingdom of God, inaugurated by Jesus Christ. Nebuchadnezzar's dream proves that human empires rise and fall, and they look incredibly intimidating, but Christ's kingdom is the only one that is eternal. 

Let's unpack these key points together and look at our cross-references for today.`,
            points: [
                "**The Bankruptcy of Babylon (2:1-11):** The world's elite wisdom completely fails when faced with spiritual reality. The Chaldeans admit only God can reveal the truth.",
                "**The Power of Corporate Prayer (2:17-18):** Daniel doesn't face the crisis alone; he calls his faithful community to plead for God's mercy.",
                "**The Prophetic Blueprint (2:31-40):** The four metals (gold, silver, bronze, iron) represent four successive world empires: Babylon, Medo-Persia, Greece, and Rome. This sets the stage for the rest of biblical prophecy.",
                "**The Unstoppable Kingdom (2:34-35, 44-45):** The stone 'cut without hands' is the Kingdom of God. It shatters human systems and grows to fill the earth. Human power is temporary; God's reign is eternal."
            ],
            refs: [
                "Revelation 13 & 17 — The beast imagery and the 'mountain as a kingdom' language trace directly back to this specific dream.",
                "Matthew 21:44 — Jesus refers to Himself as the stone that crushes those it falls on, echoing Daniel 2."
            ],
            opens: [
                "Does the fourth kingdom (iron and iron mixed with clay) point to historic Rome specifically, or a future, revived global empire?",
                "When Daniel faced a literal death sentence, his first response was to gather friends and pray for mercy. How does our modern response to sudden crisis compare to Daniel's?"
            ]
        },
        {
            label: "Revelation Chapter 1 — The Vision of the Conquering King",
            teacherScript: `Welcome to our first session in the Book of Revelation. Let's start by clearing the air: this is arguably the most misunderstood book in the entire Bible. 

People read it like a horror movie, a crystal ball, or a secret code book meant only for conspiracy theorists. But look at the very first word in the Greek text: *Apokalypsis*. It means an "unveiling" or a "revealing." This book isn't meant to hide the truth in shadows; it is meant to reveal Jesus Christ in all His glory to a hurting church.

### A Pastoral Letter to Hurting People
We have to remember the context. The Apostle John is writing this around 95 AD from exile on the prison island of Patmos. He is writing to seven real, physical churches in the Roman province of Asia (modern-day Turkey). 

These believers aren't just sitting in comfortable pews debating end-times charts. They are facing real persecution, economic boycotts, and the intense, dangerous pressure to compromise their faith and worship the Roman emperor. John is writing a pastoral letter to give them spine, courage, and hope.

### The Glorified Christ
When John hears a voice like a trumpet and turns around, he doesn't see the suffering servant of the Gospels. He sees the conquering King. 

Look closely at the imagery in verses 12 through 16: His hair is white like wool, His eyes are like a flame of fire, His feet are like burnished bronze, and His voice is like the roar of many waters. 

If you have been with us through the Book of Daniel, you should recognize this immediately! John is pulling directly from Daniel Chapter 7's 'Ancient of Days' and Daniel Chapter 10's glorious heavenly figure. This gives us our golden rule for this entire study: **The key to unlocking Revelation is the Old Testament.** John is constantly recycling Old Testament imagery to make his points.

### The Keys to Death and Hades
Look at Jesus' incredible words to John in verse 17: "Fear not, I am the first and the last, and the living one. I died, and behold I am alive forevermore, and I have the keys of Death and Hades." 

To a persecuted church facing execution by the Roman Empire, there is absolutely no greater comfort. Rome might hold the keys to the prison cells, but Jesus holds the ultimate keys to life and death. 

Let's read this magnificent opening chapter together and unpack what it means to serve a King who holds the keys to history.`,
            points: [
                "**An Unveiling, Not a Code (1:1):** The Greek word *Apokalypsis* means to reveal or uncover. The primary purpose of the book is to reveal the victorious Jesus Christ, not to confuse the reader.",
                "**Real Letters to Real People (1:4):** John is writing to seven literal, historical congregations in Asia Minor facing severe Roman persecution and cultural compromise.",
                "**The Old Testament Connection (1:12-16):** The vivid, overwhelming description of Jesus draws directly on the Old Testament, specifically the visions found in the Book of Daniel. We must let Scripture interpret Scripture.",
                "**Absolute Authority (1:17-18):** Jesus declares He holds the 'keys of Death and Hades.' The Roman Empire does not have the final say over the believer's life; the risen Christ does."
            ],
            refs: [
                "Daniel 7:9, 13 — The 'Ancient of Days' imagery with hair like pure wool and the 'Son of Man' title.",
                "Daniel 10:5-6 — The vision of the man with eyes like flaming torches, feet like burnished bronze, and a voice like a multitude."
            ],
            opens: [
                "Verse 3 promises a blessing to those who read, hear, and 'keep' the words of this prophecy. How do we practically 'keep' or obey a book filled with apocalyptic visions?",
                "Does verse 19 ('Write therefore the things that you have seen, those that are and those that are to take place after this') function as the book's strict chronological outline, or is it a general prophetic statement?"
            ]
        }
    ];

    // Populate Dropdown
    const select = document.getElementById('session-select');
    SESSIONS.forEach((s, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        opt.textContent = `Session ${index + 1}: ${s.label}`;
        select.appendChild(opt);
    });

    // Generate the Clean Display HTML
    function generateDisplay(session) {
        let html = `<h1>${session.label}</h1>`;
        
        html += `<h3 style="color:#2563eb;">Key Truths:</h3>`;
        session.points.forEach(p => { html += `<div class="point-block">${p}</div>`; });
        
        if (session.refs.length > 0) {
            html += `<h3 style="color:#7c3aed; margin-top:25px;">Cross References:</h3>`;
            html += `<ul style="line-height: 1.8;">`;
            session.refs.forEach(r => { html += `<li>${r}</li>`; });
            html += `</ul>`;
        }

        if (session.opens.length > 0) {
            html += `<h3 style="color:#d97706; margin-top:25px;">Open Discussion:</h3>`;
            session.opens.forEach(o => { html += `<div class="open-block">${o}</div>`; });
        }
        
        return html;
    }

    function loadSession(index) {
        const s = SESSIONS[index];
        
        // 1. Load Custom Teacher Script
        document.getElementById('teacher-script-content').innerHTML = s.teacherScript.replace(/\n/g, '<br>');
        
        // 2. Load Displays (Preview, Zoom, and Student all share the same clean display layout)
        const displayHTML = generateDisplay(s);
        document.getElementById('teacher-preview-content').innerHTML = displayHTML;
        document.getElementById('zoom-content').innerHTML = displayHTML;
        document.getElementById('student-content').innerHTML = displayHTML;
    }

    // Security Logic
    let isTeacherUnlocked = false;

    function switchMode(mode) {
        // Password Check for Teacher and Zoom areas
        if ((mode === 'teacher' || mode === 'zoom') && !isTeacherUnlocked) {
            const password = prompt("Enter Teacher Password to unlock presentation tools:");
            if (password === "1234") {
                isTeacherUnlocked = true;
                document.getElementById('btn-teacher').innerText = "🧑‍🏫 Teacher Script";
                document.getElementById('btn-zoom').innerText = "📺 Zoom Presentation Screen";
            } else {
                alert("Incorrect password. Returning to Student view.");
                return;
            }
        }

        // Handle Buttons
        document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('btn-' + mode).classList.add('active');

        // Handle Views
        document.querySelectorAll('.view-container').forEach(view => view.classList.remove('active'));
        document.getElementById('view-' + mode).classList.add('active');
    }

    // Initial Load
    loadSession(0);
</script>

</body>
</html>
