<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel & Revelation: Zoom & Classroom Study Hub</title>
    <style>
        :root {
            --bg-dark: #111827;
            --panel-bg: #1f2937;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --text-light: #f3f4f6;
            --text-dark: #1f2937;
            --gold: #d97706;
            --border: #374151;
        }
        body {
            font-family: Georgia, serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* --- GLOBAL NAVIGATION --- */
        .global-nav {
            background: #0f172a;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            font-family: -apple-system, sans-serif;
            flex-wrap: wrap;
            gap: 15px;
        }
        .global-nav h1 { margin: 0; font-size: 1.3em; color: #60a5fa; }
        .controls { display: flex; gap: 10px; align-items: center; }
        select {
            background: #334155;
            color: white;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 1em;
            cursor: pointer;
        }
        .mode-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .mode-btn.active { background: var(--accent); }
        .mode-btn:hover { background: var(--accent-hover); }

        /* --- VIEWS --- */
        .view-container { display: none; flex: 1; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .view-container.active { display: block; }

        /* --- TEACHER VIEW --- */
        .teacher-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        @media (max-width: 900px) { .teacher-layout { grid-template-columns: 1fr; } }
        
        .script-panel, .preview-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 25px;
            height: calc(100vh - 130px);
            overflow-y: auto;
        }
        .script-panel h2 { color: var(--gold); margin-top: 0; font-family: -apple-system, sans-serif; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
        
        .script-text { font-size: 1.15em; line-height: 1.8; color: #e5e7eb; white-space: pre-line; }
        .script-text strong { color: #93c5fd; }
        
        /* --- ZOOM PRESENTATION & STUDENT SHARED STYLES --- */
        .presentation-card {
            background: white;
            color: var(--text-dark);
            max-width: 900px;
            margin: 0 auto;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            font-size: 1.1em;
            line-height: 1.7;
        }
        .presentation-card h1 { color: #1e3a8a; border-bottom: 3px solid var(--gold); padding-bottom: 10px; margin-top: 0; }
        .point-block { background: #f8fafc; border-left: 4px solid var(--accent); padding: 15px; margin-bottom: 15px; border-radius: 0 6px 6px 0; }
        .open-block { background: #fffbeb; border-left: 4px solid var(--gold); padding: 15px; margin-bottom: 15px; border-radius: 0 6px 6px 0; }
        
        /* --- STUDENT NOTES --- */
        .student-notes {
            margin-top: 30px;
            border-top: 2px dashed #cbd5e1;
            padding-top: 20px;
            font-family: -apple-system, sans-serif;
        }
        .student-notes textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 1px solid #94a3b8;
            border-radius: 8px;
            font-size: 1em;
            box-sizing: border-box;
            resize: vertical;
            background: #f8fafc;
        }

    </style>
</head>
<body>

    <!-- TOP NAVIGATION -->
    <div class="global-nav">
        <h1>📖 Study Hub: Daniel & Revelation</h1>
        <div class="controls">
            <select id="session-select" onchange="loadSession(this.value)"></select>
            <button class="mode-btn active" id="btn-teacher" onclick="switchMode('teacher')">🧑‍🏫 Teacher Script</button>
            <button class="mode-btn" id="btn-zoom" onclick="switchMode('zoom')">📺 Zoom Presentation Screen</button>
            <button class="mode-btn" id="btn-student" onclick="switchMode('student')">📝 Student Follow-Along</button>
        </div>
    </div>

    <!-- 1. TEACHER VIEW (Script + Preview) -->
    <div id="view-teacher" class="view-container active">
        <div class="teacher-layout">
            <div class="script-panel">
                <h2>🗣️ Your Full Reading Script</h2>
                <div class="script-text" id="teacher-script-content"></div>
            </div>
            <div class="preview-panel">
                <h2 style="color: #60a5fa;">👁️ Screen Preview (What they see)</h2>
                <div class="presentation-card" id="teacher-preview-content" style="padding: 20px; font-size: 0.9em;"></div>
            </div>
        </div>
    </div>

    <!-- 2. ZOOM PRESENTATION VIEW (Clean Screen Share) -->
    <div id="view-zoom" class="view-container">
        <div class="presentation-card" id="zoom-content"></div>
    </div>

    <!-- 3. STUDENT VIEW (Follow Along + Notes) -->
    <div id="view-student" class="view-container">
        <div class="presentation-card">
            <div id="student-content"></div>
            <div class="student-notes">
                <h3 style="margin-top: 0; color: #334155;">My Personal Notes:</h3>
                <textarea placeholder="Type your thoughts, questions, and insights here as the session happens..."></textarea>
            </div>
        </div>
    </div>

<script>
    // Full Study Database Extract
    const SESSIONS = [
        {
            label: "Daniel Chapter 1 — Daniel's Resolve",
            points: [
                "Daniel's refusal of the king's food (1:8) is about covenant loyalty, not dietary law alone. The 'king's meat' would have been offered to Babylonian gods first — eating it meant participating in pagan worship.",
                "The names Daniel and his friends are given (1:7) all embed Babylonian gods — Belteshazzar, Shadrach, Meshach, Abednego — a documented Babylonian practice to erase identity."
            ],
            refs: ["Leviticus 11 — the dietary laws behind Daniel's specific concern."],
            opens: ["Was Daniel's ten-day vegetable test (1:12-14) meant as a repeatable principle, or a one-time sign for that specific situation?"]
        },
        {
            label: "Daniel Chapter 2 — Nebuchadnezzar's Statue Dream",
            points: [
                "This is the direct blueprint for Revelation's beasts. The four metals — gold, silver, bronze, iron — represent successive kingdoms (Babylon, Medo-Persia, Greece, Rome).",
                "The stone 'cut without hands' that crushes the statue and becomes a mountain filling the earth (2:34-35) is the direct source for 'mountain' functioning as kingdom-language throughout Revelation.",
                "The text itself switches languages mid-verse right here. Daniel 1:1–2:4a is Hebrew; starting at 2:4b, the text shifts to Aramaic (the diplomatic language of the empires) through chapter 7."
            ],
            refs: ["Revelation 13, 17 — the beast imagery and mountain-as-kingdom language trace directly back here."],
            opens: ["Does the fourth kingdom (iron/iron-clay) point to Rome specifically, or a future revived empire?"]
        },
        {
            label: "Revelation Chapter 1 — Prologue and Vision of Christ",
            points: [
                "The book names itself apokalypsis — 'unveiling,' disclosure, not concealment. That cuts against treating the book primarily as a code to be cracked.",
                "The seven churches (1:4) are real, named, addressed congregations in Roman Asia — not symbols first."
            ],
            refs: [
                "Daniel 7 — the Ancient of Days imagery.",
                "Daniel 10 — the glorious man by the river (eyes like flame, feet like burnished bronze) is the direct source for how the risen Christ is described here."
            ],
            opens: ["Does 1:19 ('what you saw, what is, what will be') function as the book's own structural outline, or is it just a standard apocalyptic phrase?"]
        }
    ];

    // Populate Dropdown
    const select = document.getElementById('session-select');
    SESSIONS.forEach((s, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        opt.textContent = `Session ${index + 1}: ${s.label}`;
        select.appendChild(opt);
    });

    // Generate Teacher Script dynamically from the data
    function generateScript(session) {
        let script = `Welcome everyone to our study today. We are covering **${session.label}**.\n\n`;
        script += `Let's begin by looking at the core truths from this chapter.\n\n`;
        
        session.points.forEach((p, i) => {
            script += `**Point ${i + 1}:** ${p}\n\n`;
        });

        if (session.refs.length > 0) {
            script += `Now, to understand this deeply, we have to let Scripture interpret Scripture. Let's look at the cross-references for this chapter:\n\n`;
            session.refs.forEach(r => { script += `**Reference:** ${r}\n\n`; });
        }

        if (session.opens.length > 0) {
            script += `Before we close, I want to open the floor for discussion. Here is what I want us to think about:\n\n`;
            session.opens.forEach(o => { script += `**Question:** ${o}\n\n`; });
        }
        
        script += `Take a moment to write down any final thoughts in your notes.`;
        return script;
    }

    // Generate the Clean Display HTML
    function generateDisplay(session) {
        let html = `<h1>${session.label}</h1>`;
        
        html += `<h3 style="color:#2563eb;">Key Truths:</h3>`;
        session.points.forEach(p => { html += `<div class="point-block">${p}</div>`; });
        
        if (session.refs.length > 0) {
            html += `<h3 style="color:#7c3aed; margin-top:25px;">Cross References:</h3>`;
            html += `<ul style="line-height: 1.8;">`;
            session.refs.forEach(r => { html += `<li>${r}</li>`; });
            html += `</ul>`;
        }

        if (session.opens.length > 0) {
            html += `<h3 style="color:#d97706; margin-top:25px;">Open Discussion:</h3>`;
            session.opens.forEach(o => { html += `<div class="open-block">${o}</div>`; });
        }
        
        return html;
    }

    function loadSession(index) {
        const s = SESSIONS[index];
        
        // 1. Load Teacher Script
        document.getElementById('teacher-script-content').innerHTML = generateScript(s).replace(/\n/g, '<br>');
        
        // 2. Load Displays (Preview, Zoom, and Student all share the same clean display layout)
        const displayHTML = generateDisplay(s);
        document.getElementById('teacher-preview-content').innerHTML = displayHTML;
        document.getElementById('zoom-content').innerHTML = displayHTML;
        document.getElementById('student-content').innerHTML = displayHTML;
    }

    function switchMode(mode) {
        // Handle Buttons
        document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('btn-' + mode).classList.add('active');

        // Handle Views
        document.querySelectorAll('.view-container').forEach(view => view.classList.remove('active'));
        document.getElementById('view-' + mode).classList.add('active');
    }

    // Initial Load
    loadSession(0);
</script>

</body>
</html>
